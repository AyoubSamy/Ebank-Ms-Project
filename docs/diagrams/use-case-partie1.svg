@startuml use-case-partie1
left to right direction
skinparam shadowing false
skinparam backgroundColor #FFFFFF
skinparam defaultFontName Helvetica
skinparam defaultFontSize 13
skinparam defaultFontColor #0F172A
skinparam ArrowColor #475569
skinparam ArrowFontColor #334155
skinparam ArrowFontSize 11
skinparam actor {
  BackgroundColor #FFFFFF
  BorderColor #334155
}
skinparam usecase {
  BackgroundColor #F8FAFC
  BorderColor #475569
}
skinparam rectangle {
  BackgroundColor #FFFFFF
  BorderColor #334155
  FontStyle bold
}
skinparam note {
  BackgroundColor #F1F5F9
  BorderColor #94A3B8
  FontSize 11
}

actor "Utilisateur" as U
actor "Administrateur" as A

rectangle "Système E-Bank — Partie 1" {
  usecase "Consulter la liste\ndes clients" as UC1
  usecase "Consulter un client" as UC2
  usecase "Ajouter un client" as UC3
  usecase "Consulter la liste\ndes comptes" as UC4
  usecase "Consulter un compte" as UC5
  usecase "Créer un compte\nbancaire" as UC6

  usecase "Récupérer les informations\ndu titulaire" as UC7
  usecase "Fournir un titulaire\npar défaut" as UC8

  usecase "Superviser les instances\n(tableau de bord Eureka)" as UC9
  usecase "Consulter les bases\nde données (H2)" as UC10
}

U - - UC1
U - - UC2
U - - UC3
U - - UC4
U - - UC5
U - - UC6

A - - UC9
A - - UC10

UC5 ..> UC7 : <<include>>
UC6 ..> UC7 : <<include>>
UC8 ..> UC7 : <<extend>>\n[Customer-Service indisponible]

@enduml

